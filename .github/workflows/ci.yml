name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        postgres-version: ["14", "15", "16", "17"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: pgtriage
          POSTGRES_PASSWORD: pgtriage
          POSTGRES_DB: pgtriage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGTRIAGE_CONNECTION_STRING: postgresql://pgtriage:pgtriage@localhost:5432/pgtriage_test
      PGPASSWORD: pgtriage

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v --tb=short -m "not integration"

      - name: Run integration tests
        run: pytest -v --tb=short -m integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          pip install -e ".[dev]"
          python -m build
          twine check dist/*

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/pgtriage-smoke
          /tmp/pgtriage-smoke/bin/pip install dist/*.whl
          /tmp/pgtriage-smoke/bin/pip check
          /tmp/pgtriage-smoke/bin/python -c "from mcp.server.fastmcp import FastMCP; import pgtriage.server"

      - name: Verify installed CLI startup
        env:
          PGTRIAGE_CONNECTION_STRING: postgresql://pgtriage:pgtriage@localhost:5432/pgtriage_test
        run: |
          set +e
          timeout 2s /tmp/pgtriage-smoke/bin/pgtriage < /dev/null
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
